<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knowledge Graph Extraction</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
    }

    .header {
      background: white;
      border-bottom: 1px solid #e0e0e0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #333;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #fileInput {
      font-size: 14px;
    }

    #extract {
      background: #007aff;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
    }

    #extract:hover {
      background: #0051d5;
    }

    #extract:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #status {
      padding: 12px 24px;
      background: #fff3cd;
      border-bottom: 1px solid #ffeaa7;
      color: #856404;
      font-size: 14px;
      display: none;
    }

    #status.show {
      display: block;
    }

    #status.error {
      background: #f8d7da;
      border-color: #f5c6cb;
      color: #721c24;
    }

    #status.success {
      background: #d4edda;
      border-color: #c3e6cb;
      color: #155724;
    }

    .main-content {
      display: flex;
      height: calc(100vh - 100px);
    }

    #json-panel {
      width: 350px;
      background: #fafafa;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      padding: 16px;
      display: none;
    }

    #json-panel.show {
      display: block;
    }

    #json-panel h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
    }

    #json-panel pre {
      background: white;
      padding: 12px;
      border-radius: 4px;
      font-size: 12px;
      overflow-x: auto;
      border: 1px solid #ddd;
    }

    #graph-container {
      flex: 1;
      background: white;
    }

    #details-panel {
      width: 300px;
      background: #fafafa;
      border-left: 1px solid #ddd;
      overflow-y: auto;
      padding: 16px;
      display: none;
    }

    #details-panel.show {
      display: block;
    }

    #details-panel h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
    }

    #details-panel p {
      margin: 8px 0;
      font-size: 14px;
      line-height: 1.4;
    }

    #details-panel strong {
      font-weight: 600;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 8px;
      width: 500px;
      max-width: 90%;
    }

    .modal-content h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
    }

    .modal-body {
      margin-bottom: 20px;
    }

    .file-upload-group {
      margin-bottom: 16px;
    }

    .file-upload-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-primary {
      background: #007aff;
      color: white;
    }

    .btn-primary:hover {
      background: #0051d5;
    }

    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #d0d0d0;
    }

    #loadBtn {
      background: #5856d6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    #loadBtn:hover {
      background: #4644b8;
    }

    #mergeBtn {
      background: #34c759;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    #mergeBtn:hover {
      background: #28a745;
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>Knowledge Graph Visualization</h1>
    <div class="header-controls">
      <input type="file" id="fileInput" accept=".txt,.md" />
      <button id="extract" type="button">Extract Knowledge Graph</button>
      <input type="file" id="loadGraphInput" accept=".json" style="display: none;" />
      <button id="loadBtn" type="button">Load Graph</button>
      <button id="mergeBtn" type="button">Merge Graphs</button>
    </div>
  </div>

  <!-- Merge Modal -->
  <div id="mergeModal" class="modal">
    <div class="modal-content">
      <h2>Merge Two Knowledge Graphs</h2>
      <div class="modal-body">
        <div class="file-upload-group">
          <label for="jsonFile1">Knowledge Graph 1 (JSON):</label>
          <input type="file" id="jsonFile1" accept=".json" />
        </div>
        <div class="file-upload-group">
          <label for="jsonFile2">Knowledge Graph 2 (JSON):</label>
          <input type="file" id="jsonFile2" accept=".json" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelMerge">Cancel</button>
        <button class="btn btn-primary" id="confirmMerge">Merge</button>
      </div>
    </div>
  </div>
  <div id="status"></div>
  <div class="main-content">
    <div id="json-panel"></div>
    <div id="graph-container"></div>
    <div id="details-panel"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
